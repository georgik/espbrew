[workspace]
members = ["."]

[package]
name = "espbrew"
default-run = "espbrew"
version = "0.8.0"
edition = "2024"

[[bin]]
name = "espbrew"
path = "src/main.rs"

[[bin]]
name = "espbrew-server"
path = "src/bin/espbrew-server.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
espflash = { git = "https://github.com/esp-rs/espflash.git", rev = "a02d2b1", default-features = false, features = ["serialport"] }
glob = "0.3"
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
warp = "0.3"
hostname = "0.4"
serialport = { version = "4.7", default-features = false }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
bytes = "1.0"
if-addrs = "0.15"
regex = "1.11"
ron = "0.12"
dirs = "6.0"
async-trait = "0.1"
mdns-sd = "0.12"
include_dir = "0.7"
env_logger = "0.11"
esp-idf-part = "0.6"
log = "0.4"
log-panics = "2"
idf-rs = { git = "https://github.com/georgik/idf.py-rs", branch = "main", version = "0.1" }
which = "8"
url = "2.5"
urlencoding = "2"

# Keep existing dependencies that are still used
tokio-serial = "5.4"
toml = "0.8"

# Camera capture (optional feature)
image = { version = "0.25", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["capture"]
capture = ["image", "base64"]
capture-macos = ["capture"]
capture-linux = ["capture"]

[dev-dependencies]
criterion = "0.7.0"
log-panics = "2.1.0"
tempfile = "3.23.0"

[[bench]]
name = "espbrew_benchmarks"
harness = false
