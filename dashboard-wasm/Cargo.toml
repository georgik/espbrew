[package]
name = "dashboard-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.98"
ratatui = { version = "0.30.0", default-features = false }
ratzilla = "0.3.0"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["Window", "Document", "console", "Request", "RequestInit", "RequestMode", "Response", "Headers"] }
